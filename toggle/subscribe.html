<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Plan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="home-bg">

<nav class="nav-home">
  <h2 class="logo">StreamX</h2>
  <button class="btn-primary" onclick="goToHome()">Home</button>
</nav>

<div class="container column">

  <h2 class="section-title">Choose Your Plan</h2>

  <!-- TOGGLE -->
  <div class="toggle-box">
    <span id="monthlyLabel" class="active">Monthly</span>
    <label class="switch">
      <input type="checkbox" id="planToggle">
      <span class="slider"></span>
    </label>
    <span id="yearlyLabel">Yearly</span>
  </div>

  <!-- PLANS -->
  <div class="plan-grid">

    <div class="plan-card">
      <h3>Basic</h3>
      <p class="price" data-month="199" data-year="1499">₹199</p>
      <p>Good video quality</p>
    </div>

    <div class="plan-card">
      <h3>Standard</h3>
      <p class="price" data-month="499" data-year="3499">₹499</p>
      <p>HD available</p>
    </div>

    <div class="plan-card">
      <h3>Premium</h3>
      <p class="price" data-month="799" data-year="5499">₹799</p>
      <p>Ultra HD + multiple screens</p>
    </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
