<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Timetable</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2 class="title">Weekly Timetable</h2>

<div class="table-container">

<table>
    <tr>
        <th>Time</th>
        <th>Monday</th>
        <th>Tuesday</th>
        <th>Wednesday</th>
        <th>Thursday</th>
        <th>Friday</th>
    </tr>

    <!-- 9-10 -->
    <tr>
        <td>9:00 - 10:00</td>
        <td>Math</td>
        <td>DBMS</td>
        <td rowspan="2" class="lab">FSDL Lab</td>
        <td>AI</td>
        <td>OS</td>
    </tr>

    <!-- 10-11 -->
    <tr>
        <td>10:00 - 11:00</td>
        <td>CN</td>
        <td>Math</td>
        <td>DBMS</td>
        <td>AI</td>
    </tr>

    <!-- BREAK -->
    <tr>
        <td colspan="6" class="break">BREAK</td>
    </tr>

    <!-- 11:30-12:30 -->
    <tr>
        <td>11:30 - 12:30</td>
        <td rowspan="2" class="lab">DBMS Lab</td>
        <td>OS</td>
        <td>Math</td>
        <td rowspan="2" class="lab">AI Lab</td>
        <td>CN</td>
    </tr>

    <!-- 12:30-1:30 -->
    <tr>
        <td>12:30 - 1:30</td>
        <td>FSDL</td>
        <td>OS</td>
        <td>Math</td>
    </tr>

</table>

</div>

</body>
</html>
